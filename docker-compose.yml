services:
  api:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [db]
  web:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentguard
      POSTGRES_PASSWORD: agentguard
      POSTGRES_DB: agentguard
    ports: ["5432:5432"]
    volumes: ["agentguard_data:/var/lib/postgresql/data"]
volumes:
  agentguard_data:
